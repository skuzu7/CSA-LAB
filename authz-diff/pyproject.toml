[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authzdiff"
description = "Replay captured requests as a second user and with no credentials to find broken access control (IDOR/BOLA)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[project.scripts]
authzdiff = "authzdiff.cli:main"

[tool.setuptools]
packages = ["authzdiff"]

[tool.setuptools.dynamic]
version = { attr = "authzdiff.__version__" }
