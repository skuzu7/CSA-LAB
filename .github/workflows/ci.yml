name: Local Security Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce-and-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned-environment dependencies
        run: python -m pip install -r vulnerable-app/requirements.txt

      - name: Reproduce planted findings, then validate patched regressions
        run: python scripts/run_security_suites.py
