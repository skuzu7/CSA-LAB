name: CSA-LAB CodeQL configuration

# vulnerable-app/ is insecure on purpose; its flaws are documented in writeups/
# and proven by tests/security. authz-diff/lab/ is insecure on purpose too; its
# flaws are listed in authz-diff/README.md and asserted by authz-diff/tests.
# Scanning either would only restate planted findings, so static analysis is
# aimed at the code that is meant to be correct.
paths-ignore:
  - vulnerable-app
  - authz-diff/lab
