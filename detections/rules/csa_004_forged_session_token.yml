title: CSA-LAB Forged Or Never-Issued Session Token
id: 71210330-979d-40b4-804a-8ff4eebc1789
status: experimental
description: >
  A session token was presented that either failed integrity verification
  (token_valid is false, available once the HMAC fix is deployed) or names a
  subject for which no token was issued earlier in the log (token_issued is false).
  token_issued is NOT emitted by the application; it is added by the stateful
  enrichment step in detections/enrich.py and must be reproduced as a lookup in
  the target SIEM (FINDING-004).
references:
  - https://cwe.mitre.org/data/definitions/287.html
  - https://attack.mitre.org/techniques/T1606/001/
author: skuzu7
date: 2026-11-13
tags:
  - attack.credential-access
  - attack.t1606.001
logsource:
  category: application
  product: csa-lab
detection:
  selection_endpoint:
    cs-uri-stem: '/me'
  selection_invalid:
    token_valid: false
  selection_unissued:
    token_issued: false
  condition: selection_endpoint and (selection_invalid or selection_unissued)
falsepositives:
  - Tokens issued before the start of the log window or before log rotation
  - Expired or truncated tokens from legitimate clients (token_valid branch)
level: high
csa_lab_finding: '004'
